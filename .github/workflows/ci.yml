name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  unix:
    name: ${{ matrix.os }} (${{ matrix.cc }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, cc: gcc }
          - { os: ubuntu-latest, cc: clang }
          - { os: macos-latest, cc: clang }
    steps:
      - uses: actions/checkout@v5
      - name: Build and test
        run: make test CC=${{ matrix.cc }} CFLAGS="-O2 -Werror"

  sanitizers:
    name: ubuntu-latest (gcc, AddressSanitizer + UBSan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build and test with sanitizers
        run: >-
          make test CC=gcc
          CFLAGS="-O1 -g -fno-omit-frame-pointer -fsanitize=address,undefined
          -fno-sanitize-recover=all -Werror"

  windows:
    name: windows-latest (MSVC)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Build calci
        run: cl /nologo /std:c11 /W4 /WX /O2 /Fecalci.exe src\main.c src\calc.c
      - name: Build the unit tests
        run: cl /nologo /std:c11 /W4 /WX /O2 /Isrc /Fetest_calc.exe tests\test_calc.c src\calc.c
      - name: Run the unit tests
        run: .\test_calc.exe
      - name: Run the command-line tests
        shell: bash
        run: sh tests/cli.sh ./calci.exe
